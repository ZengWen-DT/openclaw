name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir extensions/browser exec playwright-core install --with-deps chromium
      - name: Select full Chromium (managed browser equivalent)
        run: |
          pnpm --dir extensions/browser exec node --input-type=module -e 'import { chromium } from "playwright-core"; console.log("PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=" + chromium.executablePath())' >> "$GITHUB_ENV"
      - name: Real Chromium background screenshot
        env:
          OPENCLAW_BROWSER_SNAPSHOT_E2E: "1"
        run: node scripts/run-vitest.mjs run --config test/vitest/vitest.extension-browser.config.ts extensions/browser/src/browser/pw-screenshots.chromium.test.ts -t "captures a background tab" --maxWorkers=1
