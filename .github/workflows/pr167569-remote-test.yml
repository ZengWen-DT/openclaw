name: Test Signal reply typing
on:
  push:
    branches: [codex/pr167569-remote-test-20261028]
permissions:
  contents: read
jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: node scripts/run-vitest.mjs extensions/signal/src/monitor.typing.test.ts extensions/signal/src/monitor/event-handler.inbound-context.test.ts --maxWorkers=1
