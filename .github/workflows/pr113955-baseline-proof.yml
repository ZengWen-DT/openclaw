name: PR 113955 baseline proof

on:
  push:
    branches: [proof/113955-baseline]

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --import tsx scripts/ensure-playwright-chromium.mts --require-playwright-chromium
      - run: node scripts/run-vitest.mjs extensions/browser/src/browser/pw-session-cold-connect.chromium.test.ts
