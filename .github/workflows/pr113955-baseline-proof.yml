name: Web fetch inline code proof
on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact source commit
        required: true
        default: 7aee7016f08cfc43ffe5f69a70d02f5a4d84a99b
      target_repository:
        description: Public source repository
        required: true
        default: ZengWen-DT/openclaw
      expected:
        description: Expected behavioral result
        required: true
        type: choice
        options: [baseline, fixed]
      focused_checks:
        description: Run focused regression tests after proof
        type: boolean
        default: false
      full_checks:
        description: Run repository build, check, and test
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha || '7aee7016f08cfc43ffe5f69a70d02f5a4d84a99b' }}
          repository: ${{ inputs.target_repository || 'ZengWen-DT/openclaw' }}
          path: source
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          check-latest: true
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - name: Install pinned dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile
      - name: Fetch real HTTP Markdown through production tool
        working-directory: source
        env:
          EXPECTED_RESULT: ${{ inputs.expected || 'baseline' }}
          TARGET_SHA: ${{ inputs.target_sha || '7aee7016f08cfc43ffe5f69a70d02f5a4d84a99b' }}
          TARGET_REPOSITORY: ${{ inputs.target_repository || 'ZengWen-DT/openclaw' }}
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          cp ../harness/proof/web-fetch-inline-code.mts .web-fetch-inline-code-proof.mts
          set +e
          timeout 240 node --import ./scripts/tsx.mjs .web-fetch-inline-code-proof.mts > web-fetch-proof.log 2>&1
          result=$?
          set -e
          rm -f .web-fetch-inline-code-proof.mts
          cat web-fetch-proof.log
          if [ "$EXPECTED_RESULT" = baseline ]; then
            test "$result" = 2
          else
            test "$result" = 0
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: web-fetch-inline-http-${{ inputs.expected || 'baseline' }}
          path: |
            source/web-fetch-proof.log
            source/web-fetch-proof.json
      - name: Changed-file formatting
        if: inputs.focused_checks
        working-directory: source
        run: |
          files=(src/agents/tools/web-fetch-utils.ts src/agents/tools/web-fetch-utils.test.ts src/agents/tools/web-fetch-visibility.tool-extraction.test.ts docs/tools/web-fetch.md)
          set +e
          pnpm exec oxfmt --check "${files[@]}" > formatting.log 2>&1
          result=$?
          set -e
          cat formatting.log
          if [ "$result" != 0 ]; then
            pnpm exec oxfmt --write "${files[@]}"
            mkdir -p formatting-output
            cp --parents "${files[@]}" formatting-output/
            git restore -- "${files[@]}"
            exit "$result"
          fi
      - name: Focused regression checks
        id: focused
        if: inputs.focused_checks
        working-directory: source
        run: |
          set -o pipefail
          pnpm test src/agents/tools/web-fetch-utils.test.ts src/agents/tools/web-fetch-visibility.tool-extraction.test.ts --maxWorkers=1 2>&1 | tee focused-checks.log
      - name: Regression negative control against original production owner
        id: negative
        if: inputs.focused_checks
        working-directory: source
        run: |
          git fetch --no-tags --depth=1 https://github.com/openclaw/openclaw.git 7aee7016f08cfc43ffe5f69a70d02f5a4d84a99b
          trap 'git restore -- src/agents/tools/web-fetch-utils.ts' EXIT
          git show 7aee7016f08cfc43ffe5f69a70d02f5a4d84a99b:src/agents/tools/web-fetch-utils.ts > src/agents/tools/web-fetch-utils.ts
          set +e
          pnpm test src/agents/tools/web-fetch-utils.test.ts --maxWorkers=1 -t 'preserves inline-code literals' --reporter=json --outputFile=regression-negative.json > regression-negative.log 2>&1
          result=$?
          set -e
          cat regression-negative.log
          test "$result" != 0
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const report = JSON.parse(fs.readFileSync('regression-negative.json', 'utf8'));
          const selected = report.testResults.flatMap((file) => file.assertionResults)
            .filter((test) => test.fullName.includes('preserves inline-code literals') && !['pending', 'skipped'].includes(test.status));
          assert.equal(selected.length, 8, 'all eight new cases must execute');
          const failed = selected.filter((test) => test.status === 'failed');
          assert(failed.length > 0, 'original production owner must fail new cases');
          assert(failed.some((test) => test.failureMessages.some((message) => /AssertionError|expected .* to be/s.test(message))), 'failure must be a behavior assertion');
          console.log(`${selected.length} regression cases selected; ${failed.length} fail on original production owner`);
          NODE
          git restore -- src/agents/tools/web-fetch-utils.ts
          test -z "$(git diff --name-only -- src/agents/tools/web-fetch-utils.ts)"
      - name: Keep validation artifacts outside source checkout
        id: clean
        if: always()
        working-directory: source
        run: |
          mkdir -p ../validation-results
          for artifact in web-fetch-proof.log web-fetch-proof.json focused-checks.log regression-negative.log regression-negative.json formatting.log formatting-output; do
            if [ -e "$artifact" ]; then mv "$artifact" ../validation-results/; fi
          done
          rm -f .web-fetch-inline-code-proof.mts
          git diff --exit-code
          git diff --cached --exit-code
      - name: Repository build
        if: ${{ !cancelled() && inputs.full_checks && steps.focused.outcome == 'success' && steps.negative.outcome == 'success' && steps.clean.outcome == 'success' }}
        working-directory: source
        run: pnpm build
      - name: Repository checks
        if: ${{ !cancelled() && inputs.full_checks && steps.focused.outcome == 'success' && steps.negative.outcome == 'success' && steps.clean.outcome == 'success' }}
        working-directory: source
        run: pnpm check
      - name: Repository tests
        if: ${{ !cancelled() && inputs.full_checks && steps.focused.outcome == 'success' && steps.negative.outcome == 'success' && steps.clean.outcome == 'success' }}
        working-directory: source
        run: pnpm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-fetch-inline-code-${{ inputs.expected || 'baseline' }}
          path: |
            validation-results/
